name: CI - Agentic Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verifier Django
        run: python manage.py check

      - name: Executer les tests
        run: python manage.py test dashboard

  notify-n8n:
    needs: tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Envoyer le resultat a n8n
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          STATUS: ${{ needs.tests.result }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}

        run: |
          if [ -z "$N8N_WEBHOOK_URL" ]; then
            echo "N8N_WEBHOOK_URL absent. Notification ignoree."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg status "$STATUS" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT" \
            --arg run_id "$RUN_ID" \
            --arg run_url "$RUN_URL" \
            --arg event "$EVENT" \
            '{
              status: $status,
              repository: $repository,
              branch: $branch,
              commit: $commit,
              run_id: $run_id,
              run_url: $run_url,
              event: $event
            }')

          curl --fail --silent --show-error --max-time 20 \
            --retry 3 --retry-delay 5 \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$N8N_WEBHOOK_URL"
